[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmh-noaa-weather-radio-lotiem-lotwps"
version = "0.1.0"
description = "LOTWPS/LOTIEM weather processing and BMH-style local audio test framework"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "LOTWPS community contributors" }]
dependencies = []

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
windows = ["pyttsx3>=2.90", "pywin32>=306"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
