[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bmh-noaa-weather-radio-lotiem-lotwps"
version = "0.1.0"
description = "Local NWS-data workstation and simulated NOAA Weather Radio audio-feed controller"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
windows-sapi = ["pywin32>=306"]
test = ["pytest>=8.0"]

[project.scripts]
lotwps = "lotwps.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
