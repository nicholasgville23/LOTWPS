[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bmh-lotiem-lotwps"
version = "0.1.0"
description = "Modular LOTWPS, LOTIEM and Broadcast Message Handler workstation foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
windows = ["pywin32>=306"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
lotwps = "lotwps.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
