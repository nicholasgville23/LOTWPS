name: Python checks

on:
  push:
    branches:
      - feature/voicetext-paul-and-package-layout
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application modules
        run: python -m compileall -q lotwps apps lotiem run_lotwps.py
      - name: Run offline core tests
        run: python -m unittest discover -s tests -v
